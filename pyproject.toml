[project]
name = "zoo-eval"
version = "0.1.0"
description = "Web agent evaluation harness using The Zoo"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.1.40",
    "pydantic>=2.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0.3",
    "openai>=1.0",
    "beautifulsoup4>=4.12",
    "kagglehub>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
zoo-eval = "zoo_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoo_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
