# ==========================================================
# ONESTOPSHOP.ZOO (MySQL: onestopshop_db)
# ==========================================================
- id: test_shop_homepage
  sites: [onestopshop.zoo]
  intent: "View shop homepage"
  start_url: "https://onestopshop.zoo"
  complexity: atomic
  environment: domesticated
  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "View the shop homepage and tell me what products you see"
  eval:
    types: [string_match]
    answers:
      must_include_any: [product, shop, price, $]

- id: test_shop_browse_category
  sites: [onestopshop.zoo]
  intent: "Browse a product category"
  start_url: "https://onestopshop.zoo"
  complexity: atomic
  environment: domesticated
  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "Browse any product category and list the products you find"
  eval:
    types: [string_match]
    answers:
      must_include_any: [product, item]

- id: test_shop_view_product
  sites: [onestopshop.zoo]
  intent: "View product details"
  start_url: "https://onestopshop.zoo"
  complexity: atomic
  environment: domesticated
  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "Click on any product and view its details. Tell me the product name and price."
  eval:
    types: [string_match]
    answers:
      must_include: [$]

- id: test_shop_search
  sites: [onestopshop.zoo]
  intent: "Search for products"
  start_url: "https://onestopshop.zoo"
  complexity: atomic
  environment: domesticated
  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "Search for a product and tell me what you find"
  eval:
    types: [string_match]
    answers:
      must_include_any: [result, found, product]

- id: test_shop_add_to_cart
  sites: [onestopshop.zoo]
  intent: "Add product to cart"
  start_url: "https://onestopshop.zoo"
  complexity: atomic
  environment: domesticated
  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "Find any product and add it to your cart. Tell me the product name and how many items are in your cart."
  eval:
    types: [string_match]
    answers:
      must_include_any: ["1 item", "1 product", cart]
