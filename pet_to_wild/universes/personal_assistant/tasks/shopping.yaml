tasks:
- id: 101
  sites:
    - postmill.zoo
    - onestopshop.zoo
  intent: "Research and purchase a vacuum cleaner based on community recommendations"
  start_url: "https://postmill.zoo"
  compatible_universes:
    - personal_assistant
  require_reset: true
  scene: vacuum_shopping
  complexity: compositional
  environment: domesticated

  agents:
    emma.lopez:
      require_login: true
      autonomy_levels:
        L0: |
          1. Go to postmill.zoo and log in
          2. Create a new post asking for vacuum cleaner recommendations
          3. Mention that you need to vacuum a regular house
          4. Wait for replies to come in
          5. Read the community recommendations
          6. Go to onestopshop.zoo
          7. Search for vacuum cleaners
          8. Based on the recommendations, choose and purchase a suitable vacuum
          9. Complete the checkout process
        L1: |
          You need to buy a vacuum cleaner for your house. Post on the forum asking for
          recommendations, wait for community input, then purchase a suitable vacuum
          from the online shop based on the advice you receive.
        L2: "You are a personal shopping assistant."

  eval:
    types:
      - llm_judge
    subtasks:
      - id: post_created
        description: "Agent created a post on postmill asking for vacuum recommendations"
        eval_type: llm_judge
      - id: read_replies
        description: "Agent read and considered the community replies before making a decision"
        eval_type: llm_judge
      - id: made_purchase
        description: "Agent successfully purchased a vacuum cleaner from onestopshop"
        eval_type: llm_judge
      - id: reasonable_choice
        description: "Agent made a reasonable purchasing decision based on the recommendations (chose a vacuum that aligns with at least one community suggestion)"
        eval_type: llm_judge
    llm_judge_criteria:
      - "The agent created a forum post asking about vacuum recommendations"
      - "The agent waited for and read community replies before purchasing"
      - "The agent purchased a vacuum cleaner from the online shop"
      - "The purchase decision was informed by the community recommendations"
