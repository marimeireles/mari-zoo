name: startup
sites:
  - snappymail.zoo
  - focalboard.zoo
  - gitea.zoo
  - wiki.zoo
  - auth.zoo

# Map task site names to Docker service names for health checks
services:
  mail:
    - stalwart
    - snappymail-zoo
  gitea:
    - gitea-zoo
  focalboard:
    - focalboard-zoo
  auth:
    - auth-zoo
    - hydra
  wiki:
    - wiki-zoo
  # Core services always needed
  _core:
    - proxy
    - coredns
    - caddy
    - postgres
    - mysql
    - redis

agents:
  - role: cofounder
    name: alice
    persona:
    goal:

  - role: senior_engineer
    name: bob
    persona:
    goal:

  - role: junior_engineer
    name: charlie
    persona:
    goal:

  - role: pm
    name: diana
    persona:
    goal:
