tasks:
# =============================================================================
# Multi-Agent Coordination Tasks
# These tasks require agents to communicate and coordinate to achieve goals
# =============================================================================

- id: 301
  sites:
    - mail
  intent: "Alice and Bob negotiate a meeting time via email"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: meeting_negotiation
  complexity: compositional
  environment: wild

  # Coordination metadata
  coordination:
    type: negotiation
    communication_channel: email
    max_rounds: 10  # Maximum email exchanges before timeout

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      # Alice initiates the meeting request
      context: |
        YOUR CALENDAR CONSTRAINTS:
        - Monday: Free 9am-12pm, 2pm-5pm
        - Tuesday: Busy all day (board meeting)
        - Wednesday: Free 10am-3pm
        - Thursday: Free 1pm-5pm
        - Friday: Busy morning, free 2pm-5pm

        GOAL: Propose meeting times to Bob (bob@snappymail.zoo).
        Send him 2-3 time options that work for your calendar.

        IMPORTANT: After sending your email, state your proposed times in your final answer.
        Format: "I proposed meeting on [Day] at [Time]"
      autonomy_levels:
        L0: |
          1. Login to snappymail
          2. Compose an email to bob@snappymail.zoo proposing 2-3 meeting times
          3. Send the email
          4. State in your final answer which times you proposed
        L1: "Email Bob to propose 2-3 meeting times from your calendar. After sending, state which times you proposed."
        L2: "Propose meeting times to Bob via email."

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      # Bob responds to Alice's proposals
      context: |
        YOUR CALENDAR CONSTRAINTS:
        - Monday: Busy until 3pm
        - Tuesday: Free 9am-12pm
        - Wednesday: Free all day
        - Thursday: Busy all day (offsite)
        - Friday: Free 9am-1pm

        GOAL: Respond to Alice's meeting request (alice@snappymail.zoo).
        Check your inbox for her proposal, then:
        - If any of her times work for you, accept one and reply confirming it
        - If none work, suggest alternatives from your free times

        IMPORTANT: State the agreed meeting time in your final answer.
        Format: "Meeting agreed for [Day] at [Time]" or "I accepted [Day] at [Time]"
      autonomy_levels:
        L0: |
          1. Login to snappymail
          2. Check inbox for Alice's meeting request
          3. Compare her proposed times against your calendar
          4. Reply accepting a time that works for BOTH of you
          5. State the agreed meeting time in your final answer
        L1: "Check email for Alice's meeting request. Accept a time that works for your calendar and reply. State the agreed time in your final answer."
        L2: "Respond to Alice's meeting request. Accept a valid time and report it."

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.coordination_checker.verify_meeting_negotiated"
    llm_judge_criteria:
      - "Both agents exchanged at least one email each"
      - "A specific meeting day and time was agreed upon"
      - "The agreed time falls within Alice's free slots (Mon 9-12 or 2-5, Wed 10am-3pm, Thu 1-5pm, Fri 2-5pm)"
      - "The agreed time falls within Bob's free slots (Mon after 3pm, Tue 9am-12pm, Wed all day, Fri 9am-1pm)"

- id: 302
  sites:
    - mail
  intent: "Three agents coordinate to find a common meeting time"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: meeting_negotiation_3way
  complexity: compositional
  environment: wild

  coordination:
    type: negotiation
    communication_channel: email
    max_rounds: 15

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Free 9am-12pm, 2pm-5pm
        - Tuesday: Busy all day
        - Wednesday: Free 10am-3pm
        - Thursday: Free 1pm-5pm
        - Friday: Busy

        GOAL: Schedule a 1-hour meeting with Bob AND Charlie.
        All three must be free. Coordinate via email.
      autonomy_levels:
        L1: "Email Bob and Charlie to schedule a meeting. Negotiate until all three agree on a time. Report the agreed time."

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Busy until 3pm
        - Tuesday: Free 9am-12pm
        - Wednesday: Free all day
        - Thursday: Busy all day
        - Friday: Free 9am-1pm

        GOAL: Help schedule a meeting with Alice and Charlie.
        Only agree to times that work for you.
      autonomy_levels:
        L1: "Check email and help coordinate meeting with Alice and Charlie. Only accept times that work for your calendar."

    charlie:
      require_login: true
      username: charlie@snappymail.zoo
      password: charlie123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Free 10am-4pm
        - Tuesday: Free 2pm-5pm
        - Wednesday: Free 9am-1pm
        - Thursday: Busy
        - Friday: Free all day

        GOAL: Help schedule a meeting with Alice and Bob.
        Only agree to times that work for you.
      autonomy_levels:
        L1: "Check email and help coordinate meeting with Alice and Bob. Only accept times that work for your calendar."

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.coordination_checker.verify_3way_meeting"
    llm_judge_criteria:
      - "All three agents participated in email negotiation"
      - "A specific meeting time was agreed upon by all three"
      - "The time works for Alice (Mon 9-12 or 2-5, Wed 10am-3pm, Thu 1-5pm)"
      - "The time works for Bob (Mon after 3pm, Tue 9am-12pm, Wed all day, Fri 9am-1pm)"
      - "The time works for Charlie (Mon 10am-4pm, Tue 2-5pm, Wed 9am-1pm, Fri all day)"

- id: 303
  sites:
    - mail
  intent: "Agents with partial information must share to solve a problem"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: partial_info_bug
  complexity: compositional
  environment: wild

  coordination:
    type: information_sharing
    communication_channel: email

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      context: |
        You received a bug report from a user:
        "The calculator multiply function returns 7 when I call multiply(3, 4)"

        You DON'T KNOW what the correct behavior should be.
        Bob is the product owner and knows the specification.

        Email Bob to get the expected behavior, then report what the bug is.
      autonomy_levels:
        L1: "You have a bug report but don't know expected behavior. Email Bob to understand the spec, then report the bug."

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      context: |
        You are the product owner. You know the specification:
        - multiply(a, b) should return a * b
        - For example: multiply(3, 4) should return 12

        You DON'T KNOW what bug was reported.
        Alice is the developer handling a bug report.

        Answer her questions about expected behavior.
      autonomy_levels:
        L1: "Check email from Alice. Answer her questions about how multiply should work based on the spec."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Alice emailed Bob asking about the expected behavior"
      - "Bob responded with the specification (multiply should return a*b)"
      - "Alice identified the bug: multiply(3,4) returns 7 instead of 12"
