tasks:
# =============================================================================
# Multi-Agent Coordination Tasks
# These tasks require agents to communicate and coordinate to achieve goals
# =============================================================================

- id: 301
  sites:
    - mail
  intent: "Alice and Bob negotiate a meeting time via email"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: meeting_negotiation
  complexity: compositional
  environment: wild

  # Enable turn-based coordination for multi-round negotiation
  coordination:
    mode: turn_based
    max_rounds: 6
    round_timeout: 120

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      context: |
        YOUR CALENDAR CONSTRAINTS:
        - Monday: Free 9am-12pm, 2pm-5pm
        - Tuesday: Busy all day (board meeting)
        - Wednesday: Free 10am-3pm
        - Thursday: Free 1pm-5pm
        - Friday: Busy morning, free 2pm-5pm
      autonomy_levels:
        L0: |
          1. Login to snappymail
          2. Compose an email to bob@snappymail.zoo proposing 2-3 meeting times
          3. Send the email
          4. End with [SIGNAL: waiting:email_from:bob@snappymail.zoo]

          When you run again after Bob replies:
          1. Check your inbox for Bob's reply
          2. Confirm the agreed meeting time
          3. End with [SIGNAL: complete] and state the final meeting time
        L1: |
          Email Bob (bob@snappymail.zoo) to propose 2-3 meeting times from your calendar.
          After sending, end with [SIGNAL: waiting:email_from:bob@snappymail.zoo]

          When you run again after Bob replies, read his response and confirm the meeting.
          End with [SIGNAL: complete] stating the agreed time.
        L2: "Propose meeting times to Bob via email, then confirm when he responds."

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      context: |
        YOUR CALENDAR CONSTRAINTS:
        - Monday: Busy until 3pm
        - Tuesday: Free 9am-12pm
        - Wednesday: Free all day
        - Thursday: Busy all day (offsite)
        - Friday: Free 9am-1pm
      autonomy_levels:
        L0: |
          1. Login to snappymail
          2. Check inbox for Alice's meeting request
          3. If no email from Alice yet, end with [SIGNAL: waiting:email_from:alice@snappymail.zoo]
          4. Compare her proposed times against your calendar
          5. Reply accepting a time that works for BOTH of you
          6. End with [SIGNAL: complete] stating the agreed meeting time
        L1: |
          Check your inbox for Alice's meeting request (alice@snappymail.zoo).
          If no email yet, end with [SIGNAL: waiting:email_from:alice@snappymail.zoo]

          When you see Alice's email, compare her times to your calendar.
          Reply accepting a time that works for you, then end with [SIGNAL: complete]
          stating "Meeting agreed for [Day] at [Time]"
        L2: "Respond to Alice's meeting request. Accept a valid time and report it."

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.coordination_checker.verify_meeting_negotiated_with_imap"
    llm_judge_criteria:
      - "Both agents exchanged at least one email each"
      - "A specific meeting day and time was agreed upon"
      - "The agreed time falls within Alice's free slots (Mon 9-12 or 2-5, Wed 10am-3pm, Thu 1-5pm, Fri 2-5pm)"
      - "The agreed time falls within Bob's free slots (Mon after 3pm, Tue 9am-12pm, Wed all day, Fri 9am-1pm)"

- id: 302
  sites:
    - mail
  intent: "Three agents coordinate to find a common meeting time"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: meeting_negotiation_3way
  complexity: compositional
  environment: wild

  coordination:
    mode: turn_based
    max_rounds: 10
    round_timeout: 120

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Free 9am-12pm, 2pm-5pm
        - Tuesday: Busy all day
        - Wednesday: Free 10am-3pm
        - Thursday: Free 1pm-5pm
        - Friday: Busy
      autonomy_levels:
        L1: |
          Email Bob (bob@snappymail.zoo) AND Charlie (charlie@snappymail.zoo) to schedule a meeting.
          Propose 2-3 times that work for your calendar.
          After sending, end with [SIGNAL: waiting:email_from:bob@snappymail.zoo]

          In later turns, check replies and negotiate until all three agree.
          When agreement is reached, end with [SIGNAL: complete] stating the final time.

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Busy until 3pm
        - Tuesday: Free 9am-12pm
        - Wednesday: Free all day
        - Thursday: Busy all day
        - Friday: Free 9am-1pm
      autonomy_levels:
        L1: |
          Check email for messages from Alice or Charlie about scheduling a meeting.
          If no relevant email yet, end with [SIGNAL: waiting:email_from:alice@snappymail.zoo]

          When you see a proposal, reply with times that work for your calendar.
          Only agree to times you're actually free. Reply-all so everyone sees.
          When all three agree, end with [SIGNAL: complete] stating the final time.

    charlie:
      require_login: true
      username: charlie@snappymail.zoo
      password: charlie123
      context: |
        YOUR CALENDAR (keep private):
        - Monday: Free 10am-4pm
        - Tuesday: Free 2pm-5pm
        - Wednesday: Free 9am-1pm
        - Thursday: Busy
        - Friday: Free all day
      autonomy_levels:
        L1: |
          Check email for messages from Alice or Bob about scheduling a meeting.
          If no relevant email yet, end with [SIGNAL: waiting:email_from:alice@snappymail.zoo]

          When you see a proposal, reply with times that work for your calendar.
          Only agree to times you're actually free. Reply-all so everyone sees.
          When all three agree, end with [SIGNAL: complete] stating the final time.

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.coordination_checker.verify_3way_meeting"
    llm_judge_criteria:
      - "All three agents participated in email negotiation"
      - "A specific meeting time was agreed upon by all three"
      - "The time works for Alice (Mon 9-12 or 2-5, Wed 10am-3pm, Thu 1-5pm)"
      - "The time works for Bob (Mon after 3pm, Tue 9am-12pm, Wed all day, Fri 9am-1pm)"
      - "The time works for Charlie (Mon 10am-4pm, Tue 2-5pm, Wed 9am-1pm, Fri all day)"

- id: 303
  sites:
    - mail
  intent: "Agents with partial information must share to solve a problem"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: partial_info_bug
  complexity: compositional
  environment: wild

  coordination:
    mode: turn_based
    max_rounds: 6
    round_timeout: 120

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      context: |
        You received a bug report from a user:
        "The calculator multiply function returns 7 when I call multiply(3, 4)"

        You DON'T KNOW what the correct behavior should be.
        Bob is the product owner and knows the specification.
      autonomy_levels:
        L1: |
          Email Bob (bob@snappymail.zoo) to ask about the expected behavior of multiply(3, 4).
          After sending, end with [SIGNAL: waiting:email_from:bob@snappymail.zoo]

          When Bob replies with the specification, determine the bug:
          - What does it return? (7)
          - What should it return? (from Bob's answer)

          End with [SIGNAL: complete] and report the bug clearly.

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      context: |
        You are the product owner. You know the specification:
        - multiply(a, b) should return a * b
        - For example: multiply(3, 4) should return 12

        You DON'T KNOW what bug was reported.
        Alice is the developer handling a bug report.
      autonomy_levels:
        L1: |
          Check email for a message from Alice (alice@snappymail.zoo) about the multiply function.
          If no email yet, end with [SIGNAL: waiting:email_from:alice@snappymail.zoo]

          When you see Alice's question, reply explaining the specification:
          multiply(a, b) should return a * b, so multiply(3, 4) should return 12.

          End with [SIGNAL: complete] after sending your reply.

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Alice emailed Bob asking about the expected behavior"
      - "Bob responded with the specification (multiply should return a*b)"
      - "Alice identified the bug: multiply(3,4) returns 7 instead of 12"
