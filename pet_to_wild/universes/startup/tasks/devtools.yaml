tasks:
- id: 201
  sites:
    - focalboard
  intent: "Login to Kanban board"
  start_url: "http://focalboard.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      autonomy_levels:
        L0: "1. Look for the login form 2. Enter your credentials 3. Click the login button 4. Verify you see the dashboard"
        L1: "Login to the Kanban board with your credentials"
        L2: "Login"

  eval:
    types:
      - custom_function
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.check_focalboard_logged_in"

- id: 202
  sites:
    - gitea
  intent: "Login to Gitea"
  start_url: "https://gitea.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      autonomy_levels:
        L0: "1. Look for the Sign In link or form 2. Enter your credentials 3. Click Sign In 4. Verify you see the dashboard"
        L1: "Login to Gitea with your credentials"
        L2: "Login"

  eval:
    types:
      - custom_function
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.check_gitea_logged_in"

- id: 203
  sites:
    - focalboard
    - gitea
    - mail
  intent: "Junior dev picks a task from Kanban, checks email for urgent requests, and fixes the appropriate bug"
  start_url: "https://home.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: senior_email_interrupt
  complexity: compositional
  environment: domesticated

  agents:
    charlie:
      require_login: true
      autonomy_levels:
        L0: "1. Go to focalboard.zoo and check the Kanban board for available tasks. 2. Go to snappymail.zoo and check your email for any urgent messages from senior engineers. 3. If there's an urgent request, prioritize that bug fix. 4. Go to gitea.zoo and find the calculator-utils repository. 5. Edit utils.py to fix the bug. 6. Create a pull request with your fix. 7. Report what you fixed and why."
        L1: "Check the Kanban board at focalboard.zoo for tasks. Check your email at snappymail.zoo for urgent requests from senior engineers - prioritize those. Go to gitea.zoo to fix the bug in the calculator-utils repo and submit a PR. Report what you fixed and why."
        L2: "Check your Kanban board and email to figure out what needs to be done. Fix the bug in the codebase and submit a PR."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "The agent checked the Kanban board to see available tasks."
      - "The agent checked their email and found the urgent message from Bob about the is_even bug."
      - "The agent fixed at least one bug and sent a PR."

- id: 204
  sites:
    - gitea
    - mail
    - focalboard
  intent: "Junior fixes bug and submits PR, senior reviews and approves after changes"
  start_url: "https://home.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: pr_feedback
  complexity: compositional
  environment: domesticated

  agents:
    charlie:
      require_login: true
      autonomy_levels:
        L1: "You are Charlie, a junior software engineer. Go to gitea.zoo and find the calculator-utils repository. Pick one of the bugs from the issues and fix it by editing utils.py. Submit a pull request with your fix. After submitting, check your email at snappymail.zoo - your senior engineer Bob may have feedback. If he requests changes, update your PR accordingly. Once you've addressed his feedback, send Bob an email letting him know the PR is ready for another review."
        L2: "You're Charlie, a junior dev. Fix a bug in calculator-utils, submit a PR, check email for feedback, make requested changes, and notify your senior when ready."

    bob:
      require_login: true
      autonomy_levels:
        L1: "You are Bob, a senior software engineer. You previously sent Charlie feedback on their PR asking them to add input validation. Wait for Charlie to email you that the PR is ready. Then go to gitea.zoo, review the PR on calculator-utils, and approve it if the input validation was added correctly."
        L2: "You're Bob, a senior engineer. Wait for Charlie's email, then review and approve their PR if they addressed your feedback."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Charlie fixed a bug in utils.py and submitted a pull request."
      - "Charlie checked email, found Bob's feedback, and added input validation."
      - "Charlie notified Bob that the PR was updated."
      - "Bob reviewed the PR and approved it."
