tasks:
- id: 201
  sites:
    - focalboard
  intent: "Login to Kanban board"
  start_url: "http://focalboard.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice
      password: alice123
      autonomy_levels:
        L0: "1. Look for the login form 2. Enter username 'alice' 3. Enter password 'alice123' 4. Click the login button 5. Verify you see the dashboard"
        L1: "Login to the Kanban board with your credentials"
        L2: "Login"

  eval:
    types:
      - custom_function
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.check_focalboard_logged_in"

- id: 202
  sites:
    - gitea
  intent: "Login to Gitea"
  start_url: "https://gitea.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice
      password: alice123
      autonomy_levels:
        L0: "1. Look for the Sign In link or form 2. Enter username 'alice' 3. Enter password 'alice123' 4. Click Sign In 5. Verify you see the dashboard"
        L1: "Login to Gitea with your credentials"
        L2: "Login"

  eval:
    types:
      - custom_function
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.check_gitea_logged_in"

- id: 203
  sites:
    - focalboard
    - gitea
    - mail
  intent: "Junior dev picks a task from Kanban, checks email for urgent requests, and fixes the appropriate bug"
  start_url: "https://auth.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: senior_email_interrupt
  complexity: compositional
  environment: domesticated

  agents:
    charlie:
      require_login: true
      username: charlie@snappymail.zoo
      password: charlie123
      autonomy_levels:
        L0: "1. Go to auth.zoo and login with your credentials. 2. Go to focalboard.zoo and check the Kanban board for available tasks. 3. Go to snappymail.zoo and check your email for any urgent messages from senior engineers. 4. If there's an urgent request, prioritize that bug fix. 5. Go to gitea.zoo and find the calculator-utils repository. 6. Edit utils.py to fix the bug. 7. Create a pull request with your fix. 8. Report what you fixed and why."
        L1: "First login at auth.zoo with your credentials. Then check the Kanban board at focalboard.zoo for tasks. Check your email at snappymail.zoo for urgent requests from senior engineers - prioritize those. Go to gitea.zoo to fix the bug in the calculator-utils repo and submit a PR. Report what you fixed and why."
        L2: "Login at auth.zoo, then check your Kanban board and email to figure out what needs to be done. Fix the bug in the codebase and submit a PR."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "The agent checked the Kanban board to see available tasks."
      - "The agent checked their email and found the urgent message from Bob about the is_even bug."
      - "The agent fixed at least one bug and sent a PR."

- id: 204
  sites:
    - gitea
    - mail
    - auth
    - focalboard
  intent: "Junior fixes bug and submits PR, senior reviews and approves after changes"
  start_url: "https://auth.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: pr_feedback
  complexity: compositional
  environment: domesticated

  agents:
    charlie:
      require_login: true
      username: charlie@snappymail.zoo
      password: charlie123
      autonomy_levels:
        L1: "You are Charlie, a junior software engineer. First login at auth.zoo with your credentials. Then go to gitea.zoo and find the calculator-utils repository. Pick one of the bugs from the issues and fix it by editing utils.py. Submit a pull request with your fix. After submitting, check your email at snappymail.zoo - your senior engineer Bob may have feedback. If he requests changes, update your PR accordingly. Once you've addressed his feedback, send Bob an email letting him know the PR is ready for another review."
        L2: "You're Charlie, a junior dev. Login at auth.zoo, then fix a bug in calculator-utils, submit a PR, check email for feedback, make requested changes, and notify your senior when ready."

    bob:
      require_login: true
      username: bob@snappymail.zoo
      password: bob123
      autonomy_levels:
        L1: "You are Bob, a senior software engineer. First login at auth.zoo with your credentials. You previously sent Charlie feedback on their PR asking them to add input validation. Wait for Charlie to email you that the PR is ready. Then go to gitea.zoo, review the PR on calculator-utils, and approve it if the input validation was added correctly."
        L2: "You're Bob, a senior engineer. Login at auth.zoo, wait for Charlie's email, then review and approve their PR if they addressed your feedback."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Charlie fixed a bug in utils.py and submitted a pull request."
      - "Charlie checked email, found Bob's feedback, and added input validation."
      - "Charlie notified Bob that the PR was updated."
      - "Bob reviewed the PR and approved it."

# --- CRUD Operations ---

- id: 205
  sites:
    - focalboard
  intent: "Create a new card on the Kanban board"
  start_url: "http://focalboard.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice
      password: alice123
      autonomy_levels:
        L0: "1. Login with your credentials. 2. Navigate to an existing board (or create one). 3. Add a new card titled 'Review Q1 metrics'. 4. Add a description: 'Analyze Q1 performance data'. 5. Report the card was created successfully."
        L1: "Login to Kanban, add a new card titled 'Review Q1 metrics' with description about analyzing Q1 performance data."
        L2: "Create a new Kanban card about reviewing Q1 metrics."

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.devtools_checker.check_kanban_card_created"
    llm_judge_criteria:
      - "Agent created a new card with title related to 'Q1 metrics'"
      - "Agent confirms the card was created or shows it on the board"

- id: 206
  sites:
    - gitea
  intent: "Create and then edit a Gitea issue"
  start_url: "https://gitea.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: compositional
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice
      password: alice123
      autonomy_levels:
        L0: "1. Login to Gitea. 2. Navigate to the calculator-utils repository. 3. Go to Issues tab. 4. Create a new issue titled 'Add unit tests for multiply function'. 5. Add description about needing test coverage. 6. After creating, edit the issue to add the label 'enhancement'. 7. Report the issue number."
        L1: "Login to Gitea, create an issue in calculator-utils about adding unit tests for multiply, then edit it to add the 'enhancement' label."
        L2: "Create a Gitea issue about unit tests, then add a label to it."

  eval:
    types:
      - custom_function
      - llm_judge
    custom_function: "pet_to_wild.universes.startup.custom_evaluators.devtools_checker.check_gitea_issue_created"
    llm_judge_criteria:
      - "Agent created an issue about unit tests or multiply function"
      - "Agent edited the issue to add a label"
      - "Agent reported an issue number or confirmation"

- id: 207
  sites:
    - gitea
    - mail
  intent: "Create a Gitea issue from an email request"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_reset: false
  scene: seed_startup_emails
  complexity: compositional
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice@snappymail.zoo
      password: alice123
      autonomy_levels:
        L0: "1. Login to email. 2. Find the email about the production bug. 3. Note the details of the bug. 4. Go to gitea.zoo and login (username: alice, password: alice123). 5. Navigate to calculator-utils repository. 6. Create a new issue with the bug details from the email. 7. Report the issue was created with a link or number."
        L1: "Login to email, find the production bug report, then create a Gitea issue in calculator-utils capturing those bug details."
        L2: "Check email for bug reports and create corresponding Gitea issues."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Agent found and read an email about a bug"
      - "Agent created a Gitea issue that references or captures bug details from the email"
      - "Agent reports successful issue creation"

- id: 208
  sites:
    - focalboard
  intent: "Move a card between Kanban columns"
  start_url: "http://focalboard.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      username: alice
      password: alice123
      autonomy_levels:
        L0: "1. Login to Focalboard. 2. Navigate to a board that has cards. 3. Find a card in the 'To Do' or first column. 4. Move it to 'In Progress' or the next column. 5. Report which card you moved and its new status."
        L1: "Login to Kanban, find a card in the first column, and move it to the next column. Report what you moved."
        L2: "Move a Kanban card to a different column."

  eval:
    types:
      - llm_judge
    llm_judge_criteria:
      - "Agent identifies a specific card they moved"
      - "Agent reports the card's new column or status"
      - "Agent confirms the move was successful"

- id: 209
  sites:
    - gitea
  intent: "Fork a repository and make a change"
  start_url: "https://gitea.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: compositional
  environment: domesticated

  agents:
    charlie:
      require_login: true
      username: charlie
      password: charlie123
      autonomy_levels:
        L0: "1. Login to Gitea. 2. Navigate to alice/calculator-utils repository. 3. Fork the repository to your account. 4. Go to your forked repo. 5. Edit the README.md to add a line 'Forked by Charlie'. 6. Commit the change. 7. Report the URL of your forked repo."
        L1: "Login to Gitea, fork the alice/calculator-utils repo, edit the README in your fork to add 'Forked by Charlie', commit it, and report the fork URL."
        L2: "Fork calculator-utils, make a simple change, and commit it."

