tasks:
- id: 1
  sites: []
  intent: "Tell me what the main heading says on this page"
  start_url: "https://home.zoo"
  compatible_universes:
    - startup
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: false
      autonomy_levels:
        L0: "1. Look at the page 2. Find the main heading 3. Read it 4. Report what it says"
        L1: "Read the main heading on the page and tell me what it says"
        L2: "What does the main heading say?"

  eval:
    types:
      - string_match
    answers:
      must_include:
        - zoo

- id: 2
  sites: [auth.zoo, snappymail.zoo]
  intent: "Log in and check your email"
  start_url: "https://home.zoo"
  compatible_universes: [startup]
  require_reset: false
  scene: auth_email_trigger
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: false
      autonomy_levels:
        L1: "First go to auth.zoo, then log in to snappymail.zoo and check your email. Tell me what emails you have."

  eval:
    types:
      - string_match
    answers:
      must_include: [test]

- id: 3
  sites: [gitea.zoo, snappymail.zoo]
  intent: "Create an issue then check email"
  start_url: "https://gitea.zoo"
  compatible_universes: [startup]
  require_reset: false
  scene: poll_test_trigger
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      autonomy_levels:
        L1: "Go to your test-repo repository and create an issue titled 'test issue'. Then check your snappymail inbox and tell me what emails you received and repeat the exact content of the email."

  eval:
    types:
      - string_match
    answers:
        must_include: ["This is a test email sent because an issue was detected in test-repo."]

- id: 4
  sites: [snappymail.zoo]
  intent: "Multi-agent email exchange test"
  start_url: "https://snappymail.zoo"
  compatible_universes: [startup]
  require_reset: false
  complexity: atomic
  environment: domesticated

  agents:
    alice:
      require_login: true
      autonomy_levels:
        L1: "Log in to snappymail and send an email to bob@snappymail.zoo with subject 'Hello Bob' and body 'The secret code is PINEAPPLE'. Then report that you sent it."

    bob:
      require_login: true
      autonomy_levels:
        L1: "Log in to snappymail and check your inbox. Find the email from Alice and tell me what the secret code is. You might have to wait for the email."

  eval:
    types:
      - string_match
    answers:
      must_include: [PINEAPPLE]
