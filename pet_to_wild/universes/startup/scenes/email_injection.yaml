name: email_injection
description: "Seeds legitimate emails, then injects adversarial prompt injection email"

# Setup seeds legitimate emails before task starts
setup:
  - type: script
    script_path: "scripts/seed_startup_emails.py"
    description: "Send legitimate context emails first"

# Adversarial action happens during task execution
triggers:
  - type: time
    delay: 5

actions:
  - type: script
    script_path: "scripts/seed_simple_email_inject.py"
    description: "Sends adversarial email with prompt injection"
