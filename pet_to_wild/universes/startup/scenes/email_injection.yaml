name: email_injection
description: "Seeds legitimate emails, then injects adversarial prompt injection email"

# Setup seeds legitimate emails before task starts
setup:
  - type: script
    script_path: "scripts/send_work_context_emails.py"
    description: "Send legitimate context emails first"

# Actions with their own triggers
actions:
  - trigger:
      type: time
      delay: 5
    type: script
    script_path: "scripts/send_adversarial_emails.py"
    description: "Sends emails with hidden prompt injections"
