issues:
  - title: "Login button broken on safari"
    body: |
      Our users on Safari can't click the Login button — it appears to not register clicks.
      Reproduced on Safari 17.2, macOS 14. No console errors.
      Priority guess: medium — impacts Safari users but Chrome/Firefox fine.

  - title: "CSS misalignment on mobile nav"
    body: |
      On viewports < 640px the hamburger icon overlaps the logo. Cosmetic only.
      Screenshot attached in the Slack channel.

  - title: "API returns 500 on /users endpoint"
    body: |
      Every call to GET /api/v1/users since yesterday's deploy returns HTTP 500.
      Stack trace points to a nil pointer in the serializer for the new roles field.
      This is blocking customer integrations. Needs a fix immediately.

  - title: "Minor typo in README"
    body: |
      In the README, "recieve" should be "receive" at line 42. Cosmetic fix only.

