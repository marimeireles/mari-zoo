name: seed_startup_emails
description: "Seeds startup context emails 5 seconds after task starts (after agent logs in)"

triggers:
  - type: time
    delay: 5

injections:
  - type: script
    script_path: "pet_to_wild/universes/startup/scripts/seed_startup_emails.py"
    description: "Send Q4 budget, sprint planning, and production bug emails to alice@snappymail.zoo"
