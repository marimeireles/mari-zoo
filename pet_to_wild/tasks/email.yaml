tasks:
- id: 101
  sites:
    - mail
  intent: "Login to e-mail"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_login: true
  require_reset: false
  username: alice@snappymail.zoo
  password: alice123

  complexity: atomic
  environment: domesticated

  autonomy_levels:
    L0: "1. Add email and password 2. Login"
    L1: "Login to e-mail"
    L2: "Login"

  eval:
    types:
      - custom_function
    custom_function: "zoo_eval.custom_evaluators.check_inbox_loaded"

tasks:
- id: 102
  sites:
    - mail
  intent: "Login to mail and report what a specific email says"
  start_url: "https://snappymail.zoo"
  compatible_universes:
    - startup
  require_login: true
  require_reset: false
  username: alice@snappymail.zoo
  password: alice123
  scene: seed_startup_emails  # This will trigger email seeding 5s after task starts

  complexity: atomic
  environment: domesticated

  autonomy_levels:
    L0: "1. Add email and password 2. Login 3. Check inbox 4. Find email about Q4 budget 5. Report sender name"
    L1: "Check your email inbox for messages about Q4 budget and report who sent it"
    L2: "Tell me who's been emailing about the quarterly budget"

  eval:
    types:
      - string_match
    answers:
      must_include:
        - bob

